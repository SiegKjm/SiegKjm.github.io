<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>레드북 B팀 · 9월 드레스런 출결 조사</title>
<meta name="description" content="뮤지컬 레드북 B팀 9월 드레스런 참석 여부와 도착시간을 조사합니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="📕 레드북 B팀 · 9월 드레스런 출결 조사">
<meta property="og:description" content="9/6 · 9/13 · 9/20 · 9/27 · 9/28 참석 여부와 도착시간을 남겨주세요!">
<meta name="theme-color" content="#4a0710">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📕</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red-deep:#4a0710;
  --red:#8e1220;
  --red-bright:#c0182c;
  --gold:#d9b46a;
  --gold-lt:#f0dca6;
  --cream:#f7f0e2;
  --paper:#fffaf0;
  --ink:#2a1a18;
  --sub:#8a736c;
  --line:#e3d5bd;
  --ok:#1f7a4d;
  --no:#a3323f;
  --maybe:#b78617;
  --serif:"Nanum Myeongjo","Apple SD Gothic Neo","Malgun Gothic",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, #6d0d18 0%, transparent 60%),
    linear-gradient(170deg,#3a050d 0%,#2a0409 55%,#1b0206 100%);
  background-attachment:fixed;
  color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;
  min-height:100vh;overflow-x:hidden;
}
/* floating gold dust */
.dust{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.dust i{position:absolute;display:block;width:3px;height:3px;border-radius:50%;
  background:var(--gold);opacity:0;filter:blur(.4px);
  animation:rise linear infinite}
@keyframes rise{
  0%{transform:translateY(0) scale(.6);opacity:0}
  12%{opacity:.55}
  85%{opacity:.25}
  100%{transform:translateY(-115vh) scale(1.1);opacity:0}
}

/* ---------- INTRO : 책이 열린다 ---------- */
#intro{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(170deg,#3a050d,#180205);perspective:1400px}
#intro.done{animation:introOut .8s ease forwards}
@keyframes introOut{to{opacity:0;visibility:hidden;transform:scale(1.08)}}
.book{position:relative;width:210px;height:290px;transform-style:preserve-3d;
  animation:bookIn 1s cubic-bezier(.2,.8,.3,1) both}
@keyframes bookIn{from{opacity:0;transform:translateY(26px) rotateX(18deg)}to{opacity:1;transform:none}}
.book .pages{position:absolute;inset:6px 4px 6px 10px;border-radius:3px 8px 8px 3px;
  background:linear-gradient(90deg,#e8dcc4,#fffaf0 30%,#f4ead4);
  box-shadow:inset -6px 0 14px rgba(0,0,0,.16)}
.cover{position:absolute;inset:0;border-radius:4px 10px 10px 4px;
  background:linear-gradient(135deg,#a1152a,#6c0a17 55%,#4a0710);
  border-left:9px solid #3d060e;
  box-shadow:0 26px 60px rgba(0,0,0,.6), inset 0 0 60px rgba(0,0,0,.35);
  transform-origin:left center;backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  animation:openBook 1.15s cubic-bezier(.6,.02,.28,1) 1.15s forwards}
@keyframes openBook{to{transform:rotateY(-142deg)}}
.cover::after{content:"";position:absolute;inset:12px;border:1.5px solid rgba(217,180,106,.55);border-radius:3px}
.cover .emblem{width:52px;height:52px;border:2px solid var(--gold);border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--gold-lt);
  font-family:"Cinzel",var(--serif);font-size:22px;font-weight:700;
  box-shadow:0 0 22px rgba(217,180,106,.35)}
.cover h2{margin:0;font-family:"Cinzel",var(--serif);letter-spacing:5px;font-size:19px;
  color:var(--gold-lt);text-shadow:0 2px 10px rgba(0,0,0,.6)}
.cover .kr{font-family:var(--serif);font-size:13px;color:rgba(240,220,166,.75);letter-spacing:4px}
.glow{position:absolute;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(217,180,106,.5),transparent 62%);
  opacity:0;animation:flash 1.1s ease 1.6s forwards}
@keyframes flash{40%{opacity:1;transform:scale(1.25)}100%{opacity:0;transform:scale(2)}}

/* ---------- CONTENT ---------- */
.wrap{position:relative;z-index:1;max-width:580px;margin:0 auto;padding:18px 14px 56px;
  opacity:0}
.wrap.show{animation:wrapIn .7s ease .15s both}
@keyframes wrapIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

header{position:relative;text-align:center;padding:30px 20px 26px;border-radius:16px;margin-bottom:20px;
  background:linear-gradient(160deg,#8e1220,#5d0a15 60%,#42060f);
  border:1px solid rgba(217,180,106,.4);
  box-shadow:0 18px 44px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
  overflow:hidden}
header::before{content:"";position:absolute;inset:8px;border:1px solid rgba(217,180,106,.28);border-radius:10px;pointer-events:none}
header::after{content:"";position:absolute;top:0;left:-60%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,238,200,.22),transparent);
  transform:skewX(-18deg);animation:sheen 5.5s ease-in-out 1.2s infinite}
@keyframes sheen{0%{left:-60%}28%{left:135%}100%{left:135%}}
.mark{width:46px;height:46px;margin:0 auto 12px;border:1.5px solid var(--gold);border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--gold-lt);
  font-family:"Cinzel",var(--serif);font-weight:700;font-size:19px;
  animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,180,106,.4)}50%{box-shadow:0 0 0 12px rgba(217,180,106,0)}}
header h1{margin:0;font-family:"Cinzel",var(--serif);letter-spacing:6px;font-size:26px;
  color:var(--gold-lt);text-shadow:0 2px 14px rgba(0,0,0,.55)}
header .kr{font-family:var(--serif);font-size:15px;font-weight:700;color:#fff;letter-spacing:2px;margin-top:4px}
.rule{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 12px}
.rule span{height:1px;width:56px;background:linear-gradient(90deg,transparent,var(--gold))}
.rule span:last-child{background:linear-gradient(270deg,transparent,var(--gold))}
.rule b{color:var(--gold);font-size:11px;letter-spacing:2px}
header p{margin:0;font-size:13.5px;color:rgba(255,240,225,.88);line-height:1.7}
header p b{color:var(--gold-lt)}

.card{position:relative;background:linear-gradient(180deg,var(--paper),var(--cream));
  border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:13px;
  box-shadow:0 10px 26px rgba(0,0,0,.28);
  opacity:0;animation:cardIn .55s cubic-bezier(.2,.7,.3,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.985)}to{opacity:1;transform:none}}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;
  background:linear-gradient(180deg,var(--gold),rgba(217,180,106,.15))}

label.f{display:block;font-family:var(--serif);font-size:12.5px;font-weight:800;color:var(--red);
  letter-spacing:1.5px;margin-bottom:8px}
input[type=text],input[type=time],textarea,select{
  width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:9px;
  font-size:16px;font-family:inherit;background:#fffdf7;color:var(--ink);transition:.2s}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(217,180,106,.25)}
textarea{resize:vertical;min-height:64px}
select{appearance:none;-webkit-appearance:none;font-family:var(--serif);font-weight:700;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%238e1220' stroke-width='2' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center}

.date-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.date-head .num{width:26px;height:26px;flex:none;border-radius:50%;background:var(--red);color:var(--gold-lt);
  display:flex;align-items:center;justify-content:center;font-family:"Cinzel",serif;font-size:12px;font-weight:700}
.date-head .d{font-family:var(--serif);font-size:18px;font-weight:800;letter-spacing:-.2px}
.tag{font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:999px;letter-spacing:.3px;
  background:rgba(142,18,32,.08);color:var(--red);border:1px solid rgba(142,18,32,.2)}
.tag.warn{background:rgba(217,180,106,.18);color:#8a6512;border-color:rgba(217,180,106,.55)}
.tag.time{background:rgba(42,26,24,.06);color:var(--ink);border-color:rgba(42,26,24,.18);font-variant-numeric:tabular-nums}
.reset{flex:none;padding:9px 13px;border:1px solid var(--line);background:#fffdf7;border-radius:9px;
  font-family:var(--serif);font-size:12.5px;font-weight:800;color:var(--red);cursor:pointer;white-space:nowrap}
.reset:active{transform:scale(.94);background:var(--cream)}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:2px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{position:relative;display:block;text-align:center;padding:11px 4px;border:1px solid var(--line);
  border-radius:10px;font-family:var(--serif);font-size:14.5px;font-weight:800;color:var(--sub);
  cursor:pointer;background:#fffdf7;transition:.22s cubic-bezier(.2,.8,.3,1);overflow:hidden}
.seg label:active{transform:scale(.96)}
.seg input:checked + label{color:#fff;border-color:transparent;transform:translateY(-2px);
  animation:stamp .38s cubic-bezier(.3,1.4,.5,1)}
@keyframes stamp{0%{transform:scale(1.14) translateY(-2px)}60%{transform:scale(.97) translateY(-2px)}100%{transform:translateY(-2px)}}
.seg input.y:checked + label{background:linear-gradient(160deg,#2b9a67,var(--ok));box-shadow:0 6px 16px rgba(31,122,77,.35)}
.seg input.n:checked + label{background:linear-gradient(160deg,#c0182c,var(--no));box-shadow:0 6px 16px rgba(163,50,63,.35)}
.seg input.m:checked + label{background:linear-gradient(160deg,#d9a936,var(--maybe));box-shadow:0 6px 16px rgba(183,134,23,.35)}

.timerow{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;
  border-top:1px dashed var(--line);
  max-height:0;opacity:0;overflow:hidden;padding-top:0;margin-top:0;border-top-width:0;
  transition:max-height .35s ease,opacity .3s ease,margin-top .3s,padding-top .3s}
.timerow.on{max-height:90px;opacity:1;margin-top:12px;padding-top:12px;border-top-width:1px}
.timerow span{font-family:var(--serif);font-size:13px;color:var(--red);font-weight:800;white-space:nowrap}

.allrow{display:flex;gap:7px}
.allrow button{flex:1;padding:10px 2px;border:1px solid var(--line);background:#fffdf7;border-radius:9px;
  font-family:var(--serif);font-size:13px;font-weight:800;color:var(--sub);cursor:pointer;transition:.2s}
.allrow button:active{transform:scale(.95);background:var(--cream)}

.btn{position:relative;display:block;width:100%;padding:16px;border:0;border-radius:12px;
  font-family:var(--serif);font-size:16.5px;font-weight:800;letter-spacing:1px;cursor:pointer;
  color:var(--gold-lt);background:linear-gradient(160deg,#a1152a,#6c0a17);
  border:1px solid rgba(217,180,106,.5);box-shadow:0 12px 30px rgba(0,0,0,.4);
  margin-top:8px;overflow:hidden;transition:.2s}
.btn:active{transform:translateY(2px);box-shadow:0 6px 16px rgba(0,0,0,.4)}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,240,200,.3),transparent);
  transform:skewX(-18deg);animation:sheen 4.5s ease-in-out infinite}
.btn.sec{background:rgba(255,250,240,.06);color:var(--gold-lt)}

.out{position:relative;white-space:pre-wrap;background:linear-gradient(180deg,var(--paper),var(--cream));
  color:var(--ink);border:1px solid var(--gold);border-radius:12px;padding:18px 16px;
  font-family:var(--serif);font-size:14.5px;line-height:1.75;margin-top:14px;word-break:break-all;
  box-shadow:0 14px 34px rgba(0,0,0,.35)}
.out.pop{animation:unfurl .5s cubic-bezier(.2,.8,.3,1)}
@keyframes unfurl{from{opacity:0;transform:translateY(-8px) scaleY(.9);transform-origin:top}to{opacity:1;transform:none}}
.hint{font-size:12.5px;color:rgba(247,240,226,.6);margin:10px 4px 0;text-align:center}
.hide{display:none}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,26px);z-index:200;
  background:linear-gradient(160deg,#a1152a,#5d0a15);color:var(--gold-lt);
  border:1px solid rgba(217,180,106,.6);border-radius:999px;padding:13px 24px;
  font-family:var(--serif);font-weight:800;font-size:14.5px;
  box-shadow:0 16px 40px rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.35s cubic-bezier(.2,.8,.3,1)}
.toast.on{opacity:1;transform:translate(-50%,0)}

footer{text-align:center;margin-top:22px;color:rgba(217,180,106,.55);
  font-family:"Cinzel",serif;font-size:10.5px;letter-spacing:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="dust" id="dust"></div>

<div id="intro">
  <div class="glow"></div>
  <div class="book">
    <div class="pages"></div>
    <div class="cover">
      <div class="emblem">R</div>
      <h2>RED BOOK</h2>
      <div class="kr">레드북</div>
    </div>
  </div>
</div>

<div class="wrap" id="wrap">

<header>
  <div class="mark">R</div>
  <h1>RED BOOK</h1>
  <div class="kr">B팀 · 9월 드레스런</div>
  <div class="rule"><span></span><b>출결 &amp; 도착시간</b><span></span></div>
  <p>기본 연습시간 <b>14:00~22:00</b> (9/28은 19:00~22:00)<br>
  <b>늦참</b>을 고른 날만 도착 예정 시간을 적어주세요.<br>
  다 고르셨으면 맨 아래 <b>제출하기</b>!</p>
</header>

<div class="card" style="animation-delay:.05s">
  <label class="f">배역 · 이름</label>
  <select id="name">
    <option value="">— 본인을 선택해 주세요 —</option>
    <option value="안나 최하현">안나 · 최하현</option>
    <option value="브라운 김종무">브라운 · 김종무</option>
    <option value="앤디존슨 김현정">앤디 존슨 · 김현정</option>
    <option value="잭헨리 홍윤석">잭 헨리 · 홍윤석</option>
    <option value="로렐라이 박영진">로렐라이 · 박영진</option>
    <option value="도로시 안다혜">도로시 · 안다혜</option>
  </select>
</div>

<div class="card" style="animation-delay:.1s">
  <label class="f">한 번에 표시</label>
  <div class="allrow">
    <button type="button" onclick="setAll('y')">전부 참석</button>
    <button type="button" onclick="setAll('n')">전부 불참</button>
  </div>
</div>

<div id="dates"></div>

<div class="card" id="memocard">
  <label class="f">전달 사항 (선택)</label>
  <textarea id="memo" placeholder="예) 9/20은 30분 정도 늦게 도착 예정입니다"></textarea>
</div>

<button class="btn" id="submitBtn" onclick="submitForm()">제출하기</button>
<button class="btn sec" onclick="copyOut()">결과 복사하기 (수동 제출용)</button>
<div id="out" class="out hide"></div>
<p class="hint">제출이 안 되면 <b>결과 복사하기</b> 눌러 단톡방에 붙여넣어 주세요.<br>같은 이름으로 다시 제출하면 최신 응답으로 덮어써집니다.</p>

<footer>MUSICAL RED BOOK · TEAM B</footer>
</div>

<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════
   ▼▼▼ 여기에 Google Apps Script 웹앱 URL 을 붙여넣으세요 ▼▼▼
   비워두면 '복사해서 단톡방에 붙여넣기' 모드로만 동작합니다.
   ══════════════════════════════════════════════════════════ */
const ENDPOINT = "https://script.google.com/macros/s/AKfycby5zRFuJESKQabw1CGG6gY1LX7I3J87vUb3jsng4zW0gh34LOHJuLVlCPQ0_PP3MUBIeA/exec";
/* ══════════════════════════════════════════════════════════ */

/* gold dust */
(function(){
  const d=document.getElementById('dust');
  for(let i=0;i<26;i++){
    const s=document.createElement('i');
    s.style.left=Math.random()*100+'%';
    s.style.bottom='-10px';
    s.style.animationDuration=(11+Math.random()*13)+'s';
    s.style.animationDelay=(Math.random()*14)+'s';
    const sc=.6+Math.random()*1.6;
    s.style.width=s.style.height=(3*sc).toFixed(1)+'px';
    d.appendChild(s);
  }
})();

/* intro → form */
setTimeout(()=>{
  document.getElementById('intro').classList.add('done');
  document.getElementById('wrap').classList.add('show');
  setTimeout(()=>{const el=document.getElementById('intro'); if(el) el.remove();},900);
}, 2350);

const DATES = [
  {id:"d0906", label:"9/6 (일)",  time:"14:00~22:00", start:"14:00", note:"승현 오퍼", warn:false},
  {id:"d0913", label:"9/13 (일)", time:"14:00~22:00", start:"14:00", note:"", warn:false},
  {id:"d0920", label:"9/20 (일)", time:"14:00~22:00", start:"14:00", note:"", warn:false},
  {id:"d0927", label:"9/27 (일)", time:"14:00~22:00", start:"14:00", note:"A·B팀 합동 런 · 승현 오퍼", warn:true},
  {id:"d0928", label:"9/28 (월)", time:"19:00~22:00", start:"19:00", note:"승현 오퍼", warn:true}
];

document.getElementById('dates').innerHTML = DATES.map((d,i) => `
  <div class="card" style="animation-delay:${.15 + i*.07}s">
    <div class="date-head">
      <span class="num">${i+1}</span>
      <span class="d">${d.label}</span>
      <span class="tag time">${d.time}</span>
      ${d.note ? `<span class="tag ${d.warn?'warn':''}">${d.note}</span>` : ''}
    </div>
    <div class="seg">
      <input type="radio" class="y" name="${d.id}" id="${d.id}_y" value="참석" onchange="toggle('${d.id}')">
      <label for="${d.id}_y">참석</label>
      <input type="radio" class="m" name="${d.id}" id="${d.id}_m" value="늦참" onchange="toggle('${d.id}')">
      <label for="${d.id}_m">늦참</label>
      <input type="radio" class="n" name="${d.id}" id="${d.id}_n" value="불참" onchange="toggle('${d.id}')">
      <label for="${d.id}_n">불참</label>
    </div>
    <div class="timerow" id="${d.id}_t">
      <span>도착 예정</span>
      <input type="time" id="${d.id}_time" value="${d.start}">
      <button type="button" class="reset" onclick="resetTime('${d.id}')">정시</button>
    </div>
  </div>
`).join('');
document.getElementById('memocard').style.animationDelay = (.15 + DATES.length*.07) + 's';

function toggle(id){
  const v = document.querySelector(`input[name="${id}"]:checked`);
  const on = !!v && v.value === '늦참';
  document.getElementById(id+'_t').classList.toggle('on', on);
  if(on){ const t=document.getElementById(id+'_time'); if(!t.value) resetTime(id); }
}
function resetTime(id){
  const d = DATES.find(x=>x.id===id);
  document.getElementById(id+'_time').value = d.start;
}
function setAll(kind){
  DATES.forEach((d,i)=> setTimeout(()=>{
    document.getElementById(d.id+'_'+kind).checked = true; toggle(d.id);
  }, i*70));
}
function mins(t){const[h,m]=t.split(':').map(Number);return h*60+m}
function fmt(t){
  const [h,m]=t.split(':').map(Number);
  const ap=h<12?'오전':'오후', hh=h%12===0?12:h%12;
  return `${ap} ${hh}:${String(m).padStart(2,'0')}`;
}
function make(){
  const name=document.getElementById('name').value.trim();
  if(!name){ toast('배역·이름을 선택해 주세요'); document.getElementById('name').focus(); return null; }

  const lines=[`📕 레드북 B팀 9월 드레스런 출결`,`— ${name}`,''];
  const missing=[];
  DATES.forEach(d=>{
    const v=document.querySelector(`input[name="${d.id}"]:checked`);
    if(!v){ missing.push(d.label); lines.push(`${d.label} · 미응답`); return; }
    let s=`${d.label} · ${v.value}`;
    if(v.value==='참석') s += ` (${fmt(d.start)} 정시)`;
    if(v.value==='늦참'){
      const t=document.getElementById(d.id+'_time').value;
      if(!t) s += ` (도착시간 미기재)`;
      else {
        const diff = mins(t)-mins(d.start);
        s += ` (${fmt(t)} 도착${diff>0?` · ${diff}분 늦음`:''})`;
      }
    }
    lines.push(s);
  });
  const memo=document.getElementById('memo').value.trim();
  if(memo) lines.push('', `비고: ${memo}`);

  if(missing.length && !confirm(`아직 선택 안 한 날짜가 있어요:\n${missing.join(', ')}\n\n그래도 결과를 만들까요?`)) return null;

  const text=lines.join('\n');
  const out=document.getElementById('out');
  out.textContent=text; out.classList.remove('hide','pop');
  void out.offsetWidth; out.classList.add('pop');
  out.scrollIntoView({behavior:'smooth',block:'center'});
  return text;
}
function copyOut(){
  const out=document.getElementById('out');
  const text = out.classList.contains('hide') ? make() : out.textContent;
  if(!text) return;
  const done=()=>toast('복사 완료! 단톡방에 붙여넣어 주세요');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else fallback();
  function fallback(){
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }
    catch(e){ toast('결과를 길게 눌러 복사해 주세요'); }
    document.body.removeChild(ta);
  }
}
/* ---- 구글시트로 제출 ---- */
function collect(){
  const name=document.getElementById('name').value.trim();
  if(!name){ toast('배역·이름을 선택해 주세요'); document.getElementById('name').focus(); return null; }
  const data={name:name, memo:document.getElementById('memo').value.trim()};
  const missing=[];
  DATES.forEach(d=>{
    const v=document.querySelector(`input[name="${d.id}"]:checked`);
    if(!v){ missing.push(d.label); data[d.id]=''; return; }
    let s=v.value;
    if(v.value==='늦참'){
      const t=document.getElementById(d.id+'_time').value;
      s += t ? ` ${t}` : ' (시간미기재)';
    }
    data[d.id]=s;
  });
  if(missing.length){ toast(`${missing.join(', ')} 아직 안 골랐어요`); return null; }
  return data;
}
function submitForm(){
  if(!ENDPOINT){ make(); toast('결과를 복사해 단톡방에 올려주세요'); return; }
  const data=collect(); if(!data) return;
  const btn=document.getElementById('submitBtn');
  btn.disabled=true; btn.textContent='제출 중...';
  const body=new URLSearchParams(data);
  fetch(ENDPOINT,{method:'POST',body:body})
    .then(r=>r.json())
    .then(j=>{
      if(!j || !j.ok) throw new Error('server');
      btn.textContent='✓ 제출 완료';
      btn.style.background='linear-gradient(160deg,#2b9a67,#1f7a4d)';
      toast('제출 완료! 고맙습니다 📕');
      make();
    })
    .catch(()=>{
      btn.disabled=false; btn.textContent='제출하기';
      toast('제출 실패 — 결과 복사해서 단톡방에 올려주세요');
      make();
    });
}

let tt;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('on');
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('on'),2400);
}
</script>
